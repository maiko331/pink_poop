<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink Poop Diary 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              y2k: {
                hot: '#FF00CC',
                pink: '#FF99CC',
                light: '#FFCCFF',
                blue: '#00FFFF',
                purple: '#CC00FF',
              }
            },
            fontFamily: {
              mono: ['"Courier New"', 'Courier', 'monospace'],
              sans: ['"Comic Sans MS"', '"Chalkboard SE"', 'sans-serif'],
            },
            backgroundImage: {
              'glitter': "url('https://www.transparenttextures.com/patterns/stardust.png')",
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #FFCCFF;
        background-image: linear-gradient(45deg, #FFCCFF 25%, #FF99CC 25%, #FF99CC 50%, #FFCCFF 50%, #FFCCFF 75%, #FF99CC 75%, #FF99CC 100%);
        background-size: 40px 40px;
      }
      .pixel-border {
        box-shadow: 
          inset 2px 2px 0px 0px #FFFFFF,
          inset -2px -2px 0px 0px #808080,
          2px 2px 0px 0px #000000;
        border: 2px solid #FF00CC;
      }
      .win95-btn {
        box-shadow: inset -2px -2px #000000, inset 2px 2px #ffffff, inset -3px -3px #808080, inset 3px 3px #dfdfdf;
        background-color: #c0c0c0;
      }
      .win95-btn:active {
        box-shadow: inset -2px -2px #ffffff, inset 2px 2px #000000, inset -3px -3px #dfdfdf, inset 3px 3px #808080;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
